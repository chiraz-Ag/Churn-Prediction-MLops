name: CI

# Runs on every push and pull request targeting main — catches problems
# before they land on the branch everyone pulls from.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Job 1 — Lint
  # Fast, cheap checks first: catch obvious style/syntax issues before
  # spending time on tests or a Docker build.
  # -------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install lint tools
        run: pip install ruff

      - name: Run ruff (lint)
        # Lint only the API source and tests — notebooks are excluded since
        # linters aren't meant for exploratory notebook code.
        run: ruff check src/ tests/

  # -------------------------------------------------------------------------
  # Job 2 — Tests
  # Runs the pytest suite (API + preprocessing tests). Needs the model
  # artifacts in models/ to exist, since tests/test_api.py loads the real
  # app (which loads best_model.joblib, encoder.joblib, etc. at startup).
  # -------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-api.txt pytest httpx

      - name: Run pytest
        run: pytest tests/ -v

  # -------------------------------------------------------------------------
  # Job 3 — Build Docker image
  # Only runs if lint + tests both pass. Builds the same multi-stage image
  # used for deployment, to catch Dockerfile issues early. Doesn't push
  # anywhere yet — that's wired up once the cloud deployment step is ready.
  # -------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: churnguard-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max